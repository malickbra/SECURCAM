name: Déploiement automatique de SECURCAM

on:
  push:
    branches:
      - main  # déclenche le workflow quand on push sur la branche main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lancer les tests (optionnel)
        run: |
          pytest || echo "Pas de tests définis"

      - name: Déploiement (exemple)
        run: |
          echo "SECURCAM déployé avec succès !"
